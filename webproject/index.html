<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StayMate | Find Rooms & Roommates</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2 class="logo">Stay<span>Mate</span></h2>
  <div class="nav-links">
    <a href="#">Become a Host</a>
    <a href="#">Login</a>
  </div>
</header>

<!-- HERO SEARCH -->
<section class="hero">
  <h1>Find Rooms & Roommates Easily</h1>

  <div class="search-box">
    <input type="text" placeholder="Enter city">
    <input type="number" placeholder="Max Rent (₹)">
    <select>
      <option>Room Type</option>
      <option>PG</option>
      <option>Flat</option>
      <option>Shared Room</option>
    </select>
    <button>Search</button>
  </div>
</section>

<!-- LISTINGS -->
<section class="listing-section">
  <h2>Recommended for you</h2>

  <div class="cards">

    <div class="card">
      <img src="https://via.placeholder.com/300x180" />
      <div class="card-body">
        <h3>1 BHK Flat</h3>
        <p>Pune • Wakad</p>
        <p class="price">₹8,000 / month</p>
      </div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x180" />
      <div class="card-body">
        <h3>PG for Boys</h3>
        <p>Mumbai • Andheri</p>
        <p class="price">₹6,000 / month</p>
      </div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x180" />
      <div class="card-body">
        <h3>Shared Room</h3>
        <p>Bangalore • Whitefield</p>
        <p class="price">₹5,500 / month</p>
      </div>
    </div>

  </div>
</section>

</body>
</html>
